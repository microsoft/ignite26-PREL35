[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.26.0",
    "openai>=3.31.0",
]

[project.scripts]
create-agents = "scripts.create_agents:main"
setup-lab = "scripts.setup_lab:main"
lab-env = "scripts.env:main"
configure-evidence-agent = "scripts.configure_evidence_agent:main"
setup-webiq = "scripts.setup_webiq:main"
setup-obo = "scripts.setup_obo:main"
set-gateway = "scripts.set_gateway:main"
deploy-lab = "scripts.deploy:main"
lab-hook = "scripts.hooks:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pyyaml>=6.0",
]

[tool.uv.build-backend]
module-name = "scripts"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
