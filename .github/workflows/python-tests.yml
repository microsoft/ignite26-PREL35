name: Python tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Run pytest
        run: uv run pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
