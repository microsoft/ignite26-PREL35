# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ignite26-prel35
resourceGroup: ${AZURE_RESOURCE_GROUP}

requiredVersions:
  azd: '>=1.37.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.17'

infra:
  provider: bicep
  path: infra
  module: main

services:
  evidence-agent:
    name: evidence-agent
    host: azure.ai.agent
    kind: hosted
    language: python
    project: src/agents/evidence
    description: A standalone evidence brief grounded in the lab knowledge base.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      EVIDENCE_KNOWLEDGE_BASE_MCP_ENDPOINT: ${EVIDENCE_KNOWLEDGE_BASE_MCP_ENDPOINT}
      PYTHONNOUSERSITE: "1"

hooks:
  predeploy:
    shell: pwsh
    interactive: true
    run: $ErrorActionPreference = 'Stop'; Set-Location (git rev-parse --show-toplevel); & ./scripts/configure_evidence_agent.ps1 -ResourceGroup $env:AZURE_RESOURCE_GROUP -EnvironmentName $env:AZURE_ENV_NAME -ValidateOnly; & ./scripts/setup_webiq.ps1 -IfNeeded
  postdeploy:
    shell: pwsh
    run: Set-Location (git rev-parse --show-toplevel); & ./scripts/grant_evidence_access.ps1
  postprovision:
    shell: pwsh
    run: |
      $ErrorActionPreference = 'Stop'
      Set-Location (git rev-parse --show-toplevel)
      $outputNames = @(
        "FOUNDRY_PROJECT_ENDPOINT"
        "MODEL_DEPLOYMENT"
        "APIM_GATEWAY_URL"
        "APIM_NAME"
        "AZURE_RESOURCE_GROUP"
        "APPLICATIONINSIGHTS_CONNECTION_STRING"
        "APPLICATIONINSIGHTS_NAME"
        "FOUNDRY_NAME"
        "FOUNDRY_PROJECT_NAME"
        "AZURE_SEARCH_SERVICE_NAME"
        "AZURE_SEARCH_ENDPOINT"
        "AZURE_SEARCH_LOCATION"
        "AZURE_SEARCH_INDEX_NAME"
        "AZURE_SEARCH_CONNECTION_NAME"
        "AZURE_SEARCH_CONNECTION_ID"
        "AZURE_SEARCH_KNOWLEDGE_BASE_NAME"
        "INVESTIGATOR_PLANNING_DEPLOYMENT"
        "INVESTIGATOR_EMBEDDING_ENDPOINT"
        "INVESTIGATOR_EMBEDDING_DEPLOYMENT"
        "INVESTIGATOR_EMBEDDING_MODEL"
        "INVESTIGATOR_EMBEDDING_DIMENSIONS"
        "WEBIQ_RESOURCE_ID"
        "WEBIQ_ACCOUNT_NAME"
      )
      $lines = foreach ($name in $outputNames) {
        $value = azd env get-value $name
        if ($LASTEXITCODE) { throw "Could not read azd environment value $name." }
        "$name=$value"
      }
      $preserved = @(if (Test-Path .env) {
        Get-Content .env | Where-Object {
          $_ -notmatch '^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=' -or $Matches[1] -notin $outputNames
        }
      })
      Set-Content -Path .env -Value ($preserved + $lines) -Encoding utf8
      $lines | Where-Object { $_ -notmatch "^APPLICATIONINSIGHTS" } | ForEach-Object { Write-Host $_ }
      python ./scripts/create_agents.py
      if ($LASTEXITCODE) { throw 'Agent creation failed.' }
      & ./scripts/deploy.ps1 -ResourceGroup $env:AZURE_RESOURCE_GROUP -IndexOnly
      & ./scripts/configure_evidence_agent.ps1 -ResourceGroup $env:AZURE_RESOURCE_GROUP -EnvironmentName $env:AZURE_ENV_NAME
