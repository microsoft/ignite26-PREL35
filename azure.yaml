# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ignite26-prel35
resourceGroup: ${AZURE_RESOURCE_GROUP}

requiredVersions:
  azd: '>=1.37.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.17'
    azure.ai.connections: '>=1.0.0-beta.8'
    azure.ai.toolboxes: '>=1.0.0-beta.8'

infra:
  provider: bicep
  path: infra
  module: main

services:
  evidence-research:
    host: azure.ai.connection
    category: RemoteTool
    target: ${AZURE_SEARCH_ENDPOINT}/knowledgebases/${AZURE_SEARCH_KNOWLEDGE_BASE_NAME}/mcp?api-version=2026-08-01-preview
    authType: ProjectManagedIdentity
    audience: https://search.azure.com
    env:
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT}
      AZURE_SEARCH_KNOWLEDGE_BASE_NAME: ${AZURE_SEARCH_KNOWLEDGE_BASE_NAME}
  evidence-tools:
    host: azure.ai.toolbox
    uses:
      - evidence-research
    description: General financial-crime typology research through the lab knowledge base.
    tools:
      - type: mcp
        server_label: fincrime
        connection: evidence-research
        allowed_tools:
          - knowledge_base_retrieve
        require_approval: never
  evidence-agent:
    name: evidence-agent
    host: azure.ai.agent
    kind: hosted
    language: python
    project: src/agents/evidence
    uses:
      - evidence-tools
    description: A standalone evidence brief grounded in the lab knowledge base.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_EVIDENCE_TOOLS_MCP_ENDPOINT: ${TOOLBOX_EVIDENCE_TOOLS_MCP_ENDPOINT}
      PYTHONNOUSERSITE: "1"

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: |
        uv run lab-hook postprovision
        exit $LASTEXITCODE
    posix:
      shell: sh
      run: uv run lab-hook postprovision
